name: Build Circular Photo
on:
  push:
    paths:
      - "mahmoud-circle-temp.svg"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert SVG to PNG
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick
          convert -background none mahmoud-circle-temp.svg mahmoud-circle-temp.png
      - name: Commit PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mahmoud-circle-temp.png
          git diff --cached --quiet || git commit -m "Build circular CV photo PNG"
          git push