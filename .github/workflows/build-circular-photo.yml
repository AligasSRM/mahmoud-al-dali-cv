name: Build Circular Photo
on:
  push:
    paths:
      - "mahmoud-circle-temp.svg"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert SVG to PNG
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick
          convert -background none mahmoud-circle-temp.svg mahmoud-circle-temp.png
      - name: Upload PNG artifact
        uses: actions/upload-artifact@v4
        with:
          name: circular-photo-png
          path: mahmoud-circle-temp.png
